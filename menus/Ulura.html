<style>
:root{
  --bg:#12100E;
  --surface:#1C1815;
  --surface-2:#26211C;
  --line:#332C26;
  --line-soft:#241F1B;
  --text:#F4ECE2;
  --muted:#9E9084;
  --accent:#E2A64C;
  --accent-ink:#1A1206;
  --r:16px;
  --r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--text);
  font-family:"Tajawal",system-ui,sans-serif;
  font-size:16px;line-height:1.6;
  padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:0;background:none}
img{display:block;width:100%;height:100%;object-fit:cover}

/* ===================== الواجهة الافتتاحية ===================== */
.hero{
  position:relative;min-height:56vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:60px 22px 44px;
  overflow:hidden;
}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(18,16,14,.55) 0%, rgba(18,16,14,.82) 55%, var(--bg) 100%);
}
.hero-fallback{
  position:absolute;inset:0;
  background:
    radial-gradient(90% 70% at 50% 15%, #3A2E22 0%, transparent 70%),
    radial-gradient(70% 60% at 15% 85%, #2A211A 0%, transparent 65%),
    var(--bg);
}
.hero-inner{position:relative;z-index:1}
.mark{
  width:44px;height:44px;margin:0 auto 20px;border-radius:50%;
  border:1px solid var(--accent);display:grid;place-items:center;
  font-family:"Aref Ruqaa",serif;font-size:20px;color:var(--accent);
}
.brand{
  font-family:"Aref Ruqaa",serif;font-weight:700;
  font-size:clamp(38px,11vw,58px);line-height:1.2;margin:0;
  text-shadow:0 2px 24px rgba(0,0,0,.5);
}
.tagline{color:var(--muted);font-size:13.5px;margin:10px 0 0;letter-spacing:.09em}
.hero-rule{
  width:70px;height:1px;margin:24px auto 0;
  background:linear-gradient(to left, transparent, var(--accent), transparent);
}
.lang{
  position:absolute;top:18px;inset-inline-start:18px;z-index:3;
  background:rgba(38,33,28,.75);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:999px;
  padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;
}
.lang:active{transform:scale(.95)}

/* ===================== الشريط اللاصق ===================== */
.sticky{
  position:sticky;top:0;z-index:30;
  background:rgba(18,16,14,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.searchwrap{padding:12px 18px 8px}
#search{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 15px;color:var(--text);font-size:15px;font-family:inherit;
}
#search:focus{outline:none;border-color:var(--accent)}
#search::placeholder{color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 13px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;border:1px solid var(--line);border-radius:999px;
  padding:8px 17px;font-size:14px;cursor:pointer;white-space:nowrap;
  transition:background .2s,color .2s,border-color .2s;color:var(--muted);
}
.cat.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* ===================== الأكثر طلباً ===================== */
.feature{margin-top:26px}
.feature h2,.section h2{
  font-family:"Aref Ruqaa",serif;font-size:23px;font-weight:700;
  margin:0 0 14px;padding:0 18px;display:flex;align-items:center;gap:13px;
}
.feature h2::after,.section h2::after{content:"";flex:1;height:1px;background:var(--line)}
.rail{display:flex;gap:13px;overflow-x:auto;padding:2px 18px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.fcard{
  flex:0 0 236px;scroll-snap-align:start;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;text-align:start;
}
.fcard:active{transform:scale(.985)}
.fcard .ph{height:148px;position:relative}
.fcard-body{padding:12px 14px 14px}
.fcard-name{font-size:16px;font-weight:700;margin:0}
.fcard-desc{
  color:var(--muted);font-size:12.5px;font-weight:300;margin:4px 0 10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px;
}
.fcard .price{font-size:16px}

/* ===================== الأقسام ===================== */
main{padding-top:6px}
.section{margin-top:34px;scroll-margin-top:126px}
.items{padding:0 18px}

.item{
  display:flex;gap:14px;align-items:center;width:100%;text-align:start;
  padding:13px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;
}
.item:last-child{border-bottom:none}
.item:active{opacity:.75}
.thumb{
  flex:0 0 88px;height:88px;border-radius:var(--r-sm);
  overflow:hidden;position:relative;background:var(--surface-2);
}
.item-main{flex:1;min-width:0}
.item-top{display:flex;align-items:baseline;gap:10px}
.item-name{font-size:16.5px;font-weight:500;margin:0}
.dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:12px}
.price{
  font-size:16px;font-weight:800;color:var(--accent);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.price small{font-size:11px;font-weight:400;opacity:.7;margin-inline-start:3px}
.desc{
  color:var(--muted);font-size:13px;font-weight:300;margin:4px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;padding:2px 9px;border-radius:6px;background:var(--accent-soft,rgba(226,166,76,.14));color:var(--accent);font-weight:500}
.badge-out{font-size:11px;padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}

/* البديل التلقائي للصور */
.ph{position:relative;display:grid;place-items:center;overflow:hidden}
.ph span{
  font-family:"Aref Ruqaa",serif;font-size:2.4em;color:rgba(255,255,255,.17);
  line-height:1;user-select:none;
}
.ph.big span{font-size:3.4em}

/* غير المتوفر */
.item.out .thumb,.fcard.out .ph{filter:grayscale(1) brightness(.55)}
.item.out .price{color:var(--muted);text-decoration:line-through}
.veil{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(18,16,14,.55);
}
.veil b{
  font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--text);
  background:rgba(18,16,14,.85);padding:3px 9px;border-radius:5px;
}

.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14.5px}

/* ===================== بطاقة التفاصيل ===================== */
.scrim{position:fixed;inset:0;background:rgba(8,7,6,.72);opacity:0;pointer-events:none;transition:opacity .28s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:60;max-height:88vh;overflow-y:auto;
  background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.85,.25,1);
}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:11px auto 0}
.sheet .ph,.sheet .hero-img{height:210px;margin-top:14px}
.sheet-body{padding:20px 22px 30px}
.sheet-top{display:flex;align-items:flex-start;gap:14px}
.sheet h3{font-family:"Aref Ruqaa",serif;font-size:26px;margin:0;flex:1;line-height:1.3}
.sheet .price{font-size:21px}
.sheet p{color:var(--muted);font-size:14.5px;font-weight:300;margin:12px 0 0;line-height:1.85}
.sheet .tags{margin-top:14px}
.close{
  width:100%;margin-top:22px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;
}

/* ===================== شريط التواصل ===================== */
.actions{
  position:fixed;bottom:0;inset-inline:0;z-index:40;
  display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 58%, transparent);
}
.act{
  flex:1;text-align:center;text-decoration:none;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px;font-size:14.5px;font-weight:500;
}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;flex:2}
.act:active{transform:scale(.98)}

footer{text-align:center;color:var(--muted);font-size:11.5px;padding:34px 16px 6px;opacity:.5}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
@media (min-width:640px){
  .items{max-width:640px;margin:0 auto}
  .feature h2,.section h2{max-width:640px;margin-inline:auto}
  .sheet{max-width:560px;margin:0 auto;border-radius:24px 24px 0 0}
}
</style>
</head>

    <div class="mark" id="mark"></div>
    <h1 class="brand" id="brand"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="hero-rule"></div>
  </div>
</header>

<div class="sticky">
  <div class="searchwrap"><input id="search" placeholder="ابحث عن صنف…"></div>
  <div class="cats" id="cats"></div>
</div>

<section class="feature" id="feature" hidden>
  <h2 id="featureTitle"></h2>
  <div class="rail" id="rail"></div>
</section>

<main id="menu"></main>
<footer>Novacore Studios</footer>

<div class="actions" id="actions"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div id="sheetImg"></div>
  <div class="sheet-body">
    <div class="sheet-top">
      <h3 id="sheetName"></h3>
      <span class="price" id="sheetPrice"></span>
    </div>
    <div class="tags" id="sheetTags"></div>
    <p id="sheetDesc"></p>
    <button class="close" id="sheetClose"></button>
  </div>
</div>

<script>
const DATA = JSON.parse(document.getElementById("DATA").textContent);
let lang = "ar", activeCat = "all", query = "";

const $ = id => document.getElementById(id);
const t = (o,k) => o[k + "_" + lang] || o[k + "_ar"] || "";
const cur = () => DATA.brand["currency_" + lang] || DATA.brand.currency_ar;
const money = p => Number(p).toFixed(2) + ' <small>' + cur() + '</small>';

if (DATA.brand.accent){
  const _a = DATA.brand.accent.replace("#","");
  const _r = parseInt(_a.substr(0,2),16), _g = parseInt(_a.substr(2,2),16), _b = parseInt(_a.substr(4,2),16);
  const _lum = (0.299*_r + 0.587*_g + 0.114*_b) / 255;
  const _root = document.documentElement.style;
  _root.setProperty("--accent", DATA.brand.accent);
  _root.setProperty("--accent-ink", _lum > 0.6 ? "#1A1206" : "#FFF7EC");
  _root.setProperty("--accent-soft", "rgba(" + _r + "," + _g + "," + _b + ",.16)");
}

/* تدرّج لوني ثابت لكل صنف مشتق من اسمه — دافئ ومنسجم مع الهوية */
function hueOf(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return 16 + (h % 40);            // 16–56 : نطاق دافئ (بنّي → عنبري)
}
function media(item, big){
  const wrap = document.createElement("div");
  if (item.image){
    wrap.className = "ph";
    const img = document.createElement("img");
    img.src = item.image;
    img.alt = t(item,"name");
    img.loading = "lazy";
    img.onerror = () => { wrap.replaceWith(placeholder(item, big)); };
    wrap.appendChild(img);
  } else {
    return placeholder(item, big);
  }
  if (item.available === false) wrap.appendChild(veil());
  return wrap;
}
function placeholder(item, big){
  const h = hueOf(item.name_ar || item.name_en || "x");
  const d = document.createElement("div");
  d.className = "ph" + (big ? " big" : "");
  d.style.background =
    "linear-gradient(145deg, hsl(" + h + " 30% 22%) 0%, hsl(" + (h+14) + " 26% 13%) 100%)";
  const s = document.createElement("span");
  s.textContent = (t(item,"name") || "؟").trim().charAt(0);
  d.appendChild(s);
  if (item.available === false) d.appendChild(veil());
  return d;
}
function veil(){
  const v = document.createElement("div");
  v.className = "veil";
  const b = document.createElement("b");
  b.textContent = lang === "ar" ? "غير متوفر" : "Sold out";
  v.appendChild(b);
  return v;
}
function tagRow(item){
  const box = document.createElement("div");
  box.className = "tags";
  if (item.available === false){
    const b = document.createElement("span");
    b.className = "badge-out";
    b.textContent = lang === "ar" ? "غير متوفر اليوم" : "Unavailable today";
    box.appendChild(b);
  }
  (item.tags || []).forEach(tg => {
    const s = document.createElement("span");
    s.className = "tag"; s.textContent = tg;
    box.appendChild(s);
  });
  return box;
}

function applyDir(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("lang").textContent = lang === "ar" ? "EN" : "عربي";
  $("search").placeholder = lang === "ar" ? "ابحث عن صنف…" : "Search the menu…";
  $("sheetClose").textContent = lang === "ar" ? "إغلاق" : "Close";
  $("featureTitle").textContent = lang === "ar" ? "الأكثر طلباً" : "Most Ordered";
  document.title = t(DATA.brand,"name");
}

function renderHead(){
  const b = DATA.brand;
  $("brand").textContent = t(b,"name");
  $("tagline").textContent = t(b,"tagline");
  $("mark").textContent = (t(b,"name") || "•").trim().charAt(0);
  if (b.hero){
    const img = document.createElement("img");
    img.src = b.hero; img.alt = "";
    img.onerror = () => img.remove();
    $("heroBg").prepend(img);
  }
}

function renderCats(){
  const all = lang === "ar" ? "الكل" : "All";
  const list = [{id:"all", label:all}].concat(DATA.categories.map(c => ({id:c.id, label:t(c,"name")})));
  $("cats").innerHTML = "";
  list.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat" + (c.id === activeCat ? " on" : "");
    b.textContent = c.label;
    b.onclick = () => {
      activeCat = c.id; renderCats(); renderMenu(); renderFeature();
      if (c.id !== "all"){
        const el = document.getElementById("sec-" + c.id);
        if (el) el.scrollIntoView({block:"start"});
      } else {
        window.scrollTo({top: $("hero").offsetHeight - 60, behavior:"smooth"});
      }
    };
    $("cats").appendChild(b);
  });
}

function matches(it){
  if (!query) return true;
  const q = query.toLowerCase();
  return [it.name_ar, it.name_en, it.desc_ar, it.desc_en]
    .filter(Boolean).some(s => s.toLowerCase().includes(q));
}

function renderFeature(){
  const feat = [];
  DATA.categories.forEach(c => c.items.forEach(i => {
    if ((i.tags || []).some(x => x.includes("الأكثر") || x.toLowerCase().includes("most")) && i.available !== false) feat.push(i);
  }));
  const show = feat.length >= 2 && !query && activeCat === "all";
  $("feature").hidden = !show;
  if (!show) return;

  const rail = $("rail");
  rail.innerHTML = "";
  feat.forEach(it => {
    const card = document.createElement("button");
    card.className = "fcard";
    card.appendChild(media(it, false));
    const body = document.createElement("div");
    body.className = "fcard-body";
    const n = document.createElement("h3");
    n.className = "fcard-name"; n.textContent = t(it,"name");
    const d = document.createElement("p");
    d.className = "fcard-desc"; d.textContent = t(it,"desc");
    const p = document.createElement("span");
    p.className = "price"; p.innerHTML = money(it.price);
    body.append(n, d, p);
    card.appendChild(body);
    card.onclick = () => openSheet(it);
    rail.appendChild(card);
  });
}

function renderMenu(){
  const wrap = $("menu");
  wrap.innerHTML = "";
  let shown = 0;

  DATA.categories.forEach(cat => {
    if (activeCat !== "all" && activeCat !== cat.id) return;
    const items = cat.items.filter(matches);
    if (!items.length) return;
    shown += items.length;

    const sec = document.createElement("section");
    sec.className = "section";
    sec.id = "sec-" + cat.id;
    const h = document.createElement("h2");
    h.textContent = t(cat,"name");
    sec.appendChild(h);

    const box = document.createElement("div");
    box.className = "items";

    items.forEach(it => {
      const row = document.createElement("button");
      row.className = "item" + (it.available === false ? " out" : "");

      const th = document.createElement("div");
      th.className = "thumb";
      th.appendChild(media(it, false));
      row.appendChild(th);

      const main = document.createElement("div");
      main.className = "item-main";
      const top = document.createElement("div");
      top.className = "item-top";
      const nm = document.createElement("h3");
      nm.className = "item-name"; nm.textContent = t(it,"name");
      const dots = document.createElement("span"); dots.className = "dots";
      const pr = document.createElement("span");
      pr.className = "price"; pr.innerHTML = money(it.price);
      top.append(nm, dots, pr);
      main.appendChild(top);

      const d = t(it,"desc");
      if (d){
        const p = document.createElement("p");
        p.className = "desc"; p.textContent = d;
        main.appendChild(p);
      }
      const tags = tagRow(it);
      if (tags.children.length) main.appendChild(tags);

      row.appendChild(main);
      row.onclick = () => openSheet(it);
      box.appendChild(row);
    });

    sec.appendChild(box);
    wrap.appendChild(sec);
  });

  if (!shown){
    wrap.innerHTML = '<p class="empty">' + (lang === "ar" ? "ما في نتائج مطابقة." : "No matching items.") + '</p>';
  }
}

function openSheet(it){
  $("sheetName").textContent = t(it,"name");
  $("sheetPrice").innerHTML = money(it.price);
  $("sheetDesc").textContent = t(it,"desc");
  const tg = tagRow(it);
  $("sheetTags").innerHTML = tg.innerHTML;
  const holder = $("sheetImg");
  holder.innerHTML = "";
  holder.appendChild(media(it, true));
  $("sheet").classList.add("on");
  $("scrim").classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  $("sheet").classList.remove("on");
  $("scrim").classList.remove("on");
  document.body.style.overflow = "";
}

function renderActions(){
  const b = DATA.brand, box = $("actions");
  box.innerHTML = "";
  if (b.phone){
    const a = document.createElement("a");
    a.className = "act primary";
    a.href = "https://wa.me/" + b.phone;
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = lang === "ar" ? "اطلب عبر واتساب" : "Order on WhatsApp";
    box.appendChild(a);
    const c = document.createElement("a");
    c.className = "act";
    c.href = "tel:+" + b.phone;
    c.textContent = lang === "ar" ? "اتصال" : "Call";
    box.appendChild(c);
  }
  if (b.instagram){
    const i = document.createElement("a");
    i.className = "act";
    i.href = "https://instagram.com/" + b.instagram.replace("@","");
    i.target = "_blank"; i.rel = "noopener";
    i.textContent = "Instagram";
    box.appendChild(i);
  }
}

function renderAll(){ applyDir(); renderHead(); renderCats(); renderFeature(); renderMenu(); renderActions(); }

$("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; renderAll(); };
$("search").addEventListener("input", e => { query = e.target.value.trim(); renderMenu(); renderFeature(); });
$("sheetClose").onclick = closeSheet;
$("scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

renderAll();
</script>
</body>
</html>
